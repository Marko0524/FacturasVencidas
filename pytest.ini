[pytest]
# Only the reminder job's suite. The assistant in `asistente/` is a separate
# deliverable with its own dependencies (FastAPI) and its own `app` package,
# which would shadow this one if both trees were collected in the same run.
#
# Run each from its own directory:
#     pytest                            # bloque 2, desde la raíz
#     cd asistente/backend && pytest    # bloque 3
testpaths = tests
